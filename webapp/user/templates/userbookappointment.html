{% load static %}
{% include 'common/userlink.html' %}

<body class="g-sidenav-show  bg-gray-100">
   
  {% include 'common/useraside.html' %}

  <!--  MAIN -->

<main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">

     <nav
        class="navbar navbar-main navbar-expand-lg px-0 mx-3 shadow-none border-radius-xl"
        id="navbarBlur"
        data-scroll="true"
      >
        <div class="container-fluid py-1 px-3">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0">
              <li class="breadcrumb-item text-sm">
                <a class="opacity-5 text-dark" href="javascript:;">Pages</a>
              </li>
              <li class="breadcrumb-item text-sm text-dark active">
                Book Appointment
              </li>
            </ol>
          </nav>
        </div>
      </nav>

    <!--  nav ends here -->

  <div class="container-fluid py-2">
    <div class="v-container mt-2">
      <div class="grid-header mb-3">
        <h4>Register Appointment</h4>
        <small class="text-muted">Fill the form below</small>
      </div>

      <form method="POST" action="{% url 'bookAppointment' %}">
        {% csrf_token %}
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <!-- Booking for -->
        <div class="mb-3">
          <label for="booking_for" class="form-label">Booking For</label>
          <select id="booking_for" name="booking_for" class="form-select" required>
            <option value="self">Self</option>
            <option value="another">Book for Another</option>
          </select>
        </div>

        <!-- Fields for another person -->
        <div id="another_fields" class="row g-2 mb-3 hidden-fields">
          <div class="col-md-6">
            <label for="another_name" class="form-label">Other Person Name</label>
            <input type="text" id="another_name" name="name" class="form-control" placeholder="Enter name">
          </div>
          <div class="col-md-6">
            <label for="another_phone" class="form-label">Other Person Phone</label>
            <input type="tel" id="another_phone" name="phone" class="form-control" placeholder="10-digit phone" pattern="[0-9]{10}">
          </div>
        </div>

        <!-- Reason -->
        <div class="mb-3">
          <label for="reason" class="form-label">Reason for Appointment</label>
          <textarea id="reason" name="reason" class="form-control" rows="4" placeholder="Describe your health issue or reason" required></textarea>
        </div>

        <!-- Appointment Date -->
        <div class="mb-3">
          <label for="appointment_date" class="form-label">Appointment Date</label>
          <input type="date" id="appointment_date" name="date" class="form-control" required>
        </div>

        <div class="text-end mt-2">
          <button type="submit" class="btn-submit">Register Appointment</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script>
const bookingFor = document.getElementById('booking_for');
const anotherFields = document.getElementById('another_fields');
const anotherName = document.getElementById('another_name');
const anotherPhone = document.getElementById('another_phone');

function toggleFields() {
  if (bookingFor.value === 'another') {
    anotherFields.style.display = 'flex';
    anotherName.required = true;
    anotherPhone.required = true;
  } else {
    anotherFields.style.display = 'none';
    anotherName.required = false;
    anotherPhone.required = false;
  }
}

bookingFor.addEventListener('change', toggleFields);
window.addEventListener('DOMContentLoaded', toggleFields);
</script>
 <style>
.v-container {
  background: #f8f9fa;
  border-radius: 0.5rem;
  padding: 1.5rem;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  max-width: 700px;
  margin: auto;
  font-size: 14px;
}

.grid-header h4 { color: #e91e63; font-weight: 600; font-size: 18px; }
.form-label { font-weight: 600; margin-bottom: 3px; font-size: 14px; }
.form-control, .form-select, textarea {
  border: 2px solid #e91e63;
  border-radius: 0.5rem;
  padding: 6px 8px;
  background-color: #fff;
  color: #333;
  font-weight: 500;
  font-size: 13px;
}
.form-control:focus, .form-select:focus, textarea:focus {
  border-color: #f78fb3;
  box-shadow: 0 0 6px rgba(247, 143, 179, 0.5);
  outline: none;
  background-color: #fff;
}
textarea { resize: vertical; }

.btn-submit {
  background: linear-gradient(90deg,#f78fb3,#f8a5c2);
  color: white;
  font-weight: 600;
  border-radius: 10px;
  padding: 8px 20px;
  border: none;
  font-size: 14px;
  transition: 0.3s;
}
.btn-submit:hover {
  background: linear-gradient(90deg,#f8a5c2,#f78fb3);
  transform: scale(1.02);
}

.hidden-fields { display: none; }
</style>

</body>

</html>
